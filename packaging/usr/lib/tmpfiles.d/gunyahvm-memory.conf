# Opt-in VM package: only shmem mappings explicitly requesting THP are eligible.
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
# The same opt-in for the folio sizes below 2 MiB. A shared guest RAM window
# whose 2 MiB folio cannot be assembled then gets the largest contiguous
# folios still free (1 MiB down to 64 KiB) instead of 512 scattered 4 KiB
# pages: when the guest accepts the window, the Gunyah resource manager has
# the hypervisor map every physically contiguous run of it separately, and
# refuses the boot ("could not map the virtual machine's boot memory") once
# too many runs exhaust the hypervisor's fixed heap. Kernels without the
# per-size controls skip these.
w /sys/kernel/mm/transparent_hugepage/hugepages-1024kB/shmem_enabled - - - - inherit
w /sys/kernel/mm/transparent_hugepage/hugepages-512kB/shmem_enabled - - - - inherit
w /sys/kernel/mm/transparent_hugepage/hugepages-256kB/shmem_enabled - - - - inherit
w /sys/kernel/mm/transparent_hugepage/hugepages-128kB/shmem_enabled - - - - inherit
w /sys/kernel/mm/transparent_hugepage/hugepages-64kB/shmem_enabled - - - - inherit
